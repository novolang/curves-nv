[package]
name        = "curves-nv"
version     = "0.0.2"
description = "Planar curves as values: quadratic and cubic Béziers, elliptical arcs, B-splines and Catmull-Rom splines, with evaluation, derivatives, curvature, arc length and its inverse, subdivision, flattening to a named tolerance, nearest point, exact and hull bounds, and intersection with a line.  Every tolerance is an argument.  Interface only — every body is a todo()."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `core`.  A curve is four points and the operations on it are
# arithmetic: de Casteljau subdivision, a derivative that is a curve of
# one lower degree, a Gauss-Legendre quadrature for arc length.
# Nothing is read, nothing is drawn and no clock is consulted.
layer       = "core"

category    = "graphics"

tags        = ["bezier", "curve", "spline", "bspline", "catmull-rom", "arc", "flatten", "arc-length", "kurbo", "geometry"]
repository  = "https://github.com/novolang/curves-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.9.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Béziers, arcs and splines as values, with every tolerance an argument"

[dependencies]
# geometry-nv supplies `GeomPointF`, `GeomVecF`, `GeomRectF` and
# `GeomXform`, and THIS PACKAGE DOES NOT CARRY A POINT TYPE OF ITS OWN.
#
# The alternative was a private `CurvePoint`, which would have removed
# one package from the closure and added a conversion to every call
# site that matters.  The call sites that matter are known: svg-nv's
# paths are already spelled in `GeomPointF` and its `svgpath.flatten`
# answers the same polyline this package's `flatten` does, so a private
# point would put a copy between a curve and the drawing it is for.
# `nearest_point` answers a point a caller compares against a mouse
# position it already holds in `GeomPointF`, `bounds` answers a
# `GeomRectF` that the rectangle algebra is already written for, and
# a transform applied to a curve is `GeomXform` or it is a second
# 2x3 matrix on the registry.
#
# The standard library declares `Point` and `Rect`, so a private type
# could not have used the short names either.  Two prefixed 2D point
# types on one registry, with converters between them, is the outcome
# a private type buys.
#
# `core` with no dependencies of its own, so the layer rule holds and
# the closure grows by one.
geometry-nv = "^0.1.0"
